why: "Access PostHog analytics, feature flags, experiments, error tracking, and insights directly from your AI coding tool."
evidence:
  - "https://github.com/PostHog/ai-plugin/blob/e0fbf5e742fb4242c4ea509b395b2e343642f0b7/.claude-plugin/plugin.json (version 1.1.67, license MIT; the why sentence is the first sentence of its description)"
  - "License: the repo has no LICENSE file and GitHub reports none; the MIT line in plugin.json and in .claude-plugin/marketplace.json counts under the owner's rule. The plugin also points at PostHog's hosted MCP server, whose terms I did not read: owner decision in the note"
  - "audit.html: \"Lets the agent read the real error or funnel before it touches the fix. Both are on your résumé and neither is in your loop yet.\" (sentry · posthog, Project scope) and \"Prefer entries the vendor itself publishes\""
  - "https://github.com/PostHog/ai-plugin/blob/e0fbf5e742fb4242c4ea509b395b2e343642f0b7/.mcp.json: hosted http server https://mcp.posthog.com/mcp with header x-posthog-mcp-consumer: plugin; README step 2: sign in by OAuth through /mcp (setup medium: a PostHog account). Tools are deferred; the plugin also ships 162 entries under skills/ (contents listing at the pin), an error-analyzer agent and llma-cc commands"
  - "hooks/hooks.json at the pin: SessionEnd runs telemetry/hooks/session-end-llma.py and PreToolUse (matcher __exec$) runs hooks/gate-exec-write.sh: installs-hook. Neither prints text to the model: the session-end script exits without sending unless POSTHOG_LLMA_CC_ENABLED=true and POSTHOG_API_KEY are both set (config.py: default \"false\"; README: both are required), so session capture to PostHog LLM Analytics is opt-in, not on by default. The gate returns permissionDecision ask (a prompt for the user on sensitive write calls to mcp__posthog__exec) and fails open; it does not auto-approve. Context low"
  - "Pin choice: the official marketplace pins this sha (anthropics/claude-plugins-official at a2e251d9b97b, url PostHog/ai-plugin). Vendor HEAD 3f06d3adcc58 is 36 commits ahead and changes or adds hooks the pin lacks (hooks/skill-invoked.sh, hooks/user-prompt-expansion.json, hooks/read-tools.txt, hooks/cursor-hooks.json in the compare list); I did not read them, so a later pin move needs a fresh hook review"
  - "applies_when note: the audit gives Project scope; the docs name no dependency, so the PostHog SDK packages (npm view: posthog-js 1.445.1, posthog-node 5.61.2, posthog-react-native 4.85.2) are my inference"
