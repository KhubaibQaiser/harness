# .harness/config.yaml — written by harness init <version>. Edit freely; run harness doctor after.

# Config schema version.
version: 1

# Which checks run.
checks:
  guard: true
  protect: true
  depVerify: true
  multiFile: false
  tdd: false
  stop: true
  prSize: true

# Claude Code's sandbox: required for unattended runs (unattended), on for everyone (always), or not used (off).
sandbox: unattended

# Version of the catalog the recommendations came from (0: no catalog).
catalog_version: 0

# What this project is, from the interview. Used to recommend tools; codeowners is input only.
project:
  type: ""
  domain: ""
  compliance: []
  data_handling: ""
  team_size: 0
  open_source: false
  codeowners: []
  deploy_target: ""
  run_budget_usd: 0
  named_items: []
  scope_paths: []

# Runnable apps in the repo: how to start them and what login (credential names only, never values) they need.
apps: []

# Catalog items chosen for this project.
items: []

# Git settings.
git:
  commit_trailer: ""

# Always-loaded context budget, your repo's own files included. harness context measures it; init, update, add and sync ask before going over.
context:
  budget_tokens: 2000
  count: auto
  count_model: claude-opus-5-5

# Red-first TDD enforcement (needs checks.tdd).
tdd:
  paths: []
  exempt: []
  diff_coverage: 80
  coverage_skip: []
  test_lock: true
  results_dir: .harness/results

# Multi-file edit gate (needs checks.multiFile).
multi_file_gate:
  generated: []

# Pull request size (needs checks.prSize). Asks above max_lines or max_files; the pr-ship skill aims for target_lines.
pr_size:
  target_lines: 200
  max_lines: 400
  max_files: 20
  exclude:
    - "**/pnpm-lock.yaml"
    - "**/package-lock.json"
    - "**/npm-shrinkwrap.json"
    - "**/yarn.lock"
    - "**/bun.lock"
    - "**/bun.lockb"
    - "**/Cargo.lock"
    - "**/poetry.lock"
    - "**/uv.lock"
    - "**/Pipfile.lock"
    - "**/Gemfile.lock"
    - "**/composer.lock"
    - "**/go.sum"
    - "**/.!(npm|harness)ignore"
    - "**/__snapshots__/**"
    - "**/*.snap"

# Behaviour when no human is watching.
unattended:
  multi_file_gate: block
  require_reason: false

# Verification steps that must pass before the agent may stop.
stop:
  steps:
    - format:check
    - lint
    - typecheck
    - test
  package_manager: pnpm
  max_attempts: 3
  timeout_s: 540
  base_ref: origin/main
  coverage_globs:
    - "**/coverage/coverage-final.json"
