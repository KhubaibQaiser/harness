# .harness/config.yaml — written by harness init <version>. Edit freely; run harness doctor after.

# Config schema version.
version: 1

# Which checks run.
checks:
  guard: true
  protect: true
  depVerify: true
  multiFile: false
  tdd: false
  stop: true

# Claude Code's sandbox: required for unattended runs (unattended), on for everyone (always), or not used (off).
sandbox: unattended

# Version of the catalog the recommendations came from (0: no catalog).
catalog_version: 0

# What this project is, from the interview. Used to recommend tools; codeowners is input only.
project:
  type: ""
  domain: ""
  compliance: []
  data_handling: ""
  team_size: 0
  open_source: false
  codeowners: []
  deploy_target: ""
  run_budget_usd: 0
  named_items: []
  scope_paths: []

# Runnable apps in the repo: how to start them and what login (credential names only, never values) they need.
apps: []

# Catalog items chosen for this project.
items: []

# Git settings.
git:
  commit_trailer: ""

# Red-first TDD enforcement (needs checks.tdd).
tdd:
  paths: []
  exempt: []
  diff_coverage: 80
  coverage_skip: []
  test_lock: true
  results_dir: .harness/results

# Multi-file edit gate (needs checks.multiFile).
multi_file_gate:
  generated: []

# Behaviour when no human is watching.
unattended:
  multi_file_gate: block
  require_reason: false

# Verification steps that must pass before the agent may stop.
stop:
  steps:
    - format:check
    - lint
    - typecheck
    - test
  package_manager: pnpm
  max_attempts: 3
  timeout_s: 540
  base_ref: origin/main
  coverage_globs:
    - "**/coverage/coverage-final.json"
