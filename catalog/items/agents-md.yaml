id: agents-md
kind: rule
title: AGENTS.md block
source:
  type: own
  checks: [decisions]
  merge: [agents-md]
license: Apache-2.0
min_claude_code: 2.1.314
applies_when:
  always: true
cost:
  context: low
  setup: none
stance: default
why: >-
  A harness block in AGENTS.md with only what the agent cannot infer from the code, kept under 60 lines, plus an @AGENTS.md import in CLAUDE.md. It also owns the checks.decisions gate, so deselecting it turns that gate off.
evidence:
  - docs/specs/2026-11-01-harness-beta-design.md#3-what-each-repo-gets
  - docs/specs/2026-10-30-harness-design.md#6-target-repo-layout
