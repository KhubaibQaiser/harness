  - "License: repo awslabs/agent-plugins is Apache-2.0 (GitHub); plugin.json says Apache-2.0; the plugin directory has no LICENSE file of its own"
  - "https://github.com/awslabs/agent-plugins/blob/fbefb3764e67558fe10ac834dd85db49734aa9b6/plugins/databases-on-aws/.mcp.json (awsknowledge: hosted http https://knowledge-mcp.global.api.aws; aurora-dsql and cloudwatch: `uvx awslabs.aurora-dsql-mcp-server@latest` and `uvx awslabs.cloudwatch-mcp-server@latest`, UNPINNED @latest. Both are marked \"disabled\": true in the vendor file and the vendor README says they are off by default, but Claude Code's MCP docs do not define a `disabled` key, so whether they start is unverified. If Claude Code ignores the key, two unpinned servers launch every session. Flagged with deploy-on-aws and aws-serverless; cloudwatch needs AWS_REGION and AWS_PROFILE filled in)"
