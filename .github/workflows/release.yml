name: release
# Publishing waits for approval. The owner creates the GitHub environment `npm-release` once,
# with themselves as a required reviewer; setup steps are in docs/release.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# One release run at a time; a second one waits instead of cancelling a publish in progress.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # fetches origin/main too, for the on-main check
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge it to main, then tag a commit on main." >&2
            exit 1
          fi
      - name: Check tag equals package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v" >&2
            exit 1
          fi
      # The GitHub release reads these notes after npm publishes, so check them before anything ships.
      - name: Check the release notes exist
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ ! -s "docs/release-notes/$v.md" ]; then
            echo "Missing docs/release-notes/$v.md. Add the release notes, merge to main, then tag again." >&2
            exit 1
          fi
  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    environment: npm-release
    # npm trusted publishing (OIDC): no token; npm links this workflow to the package.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Pin npm (trusted publishing needs 11.5.1 or newer)
        run: npm install -g npm@11.5.1
      # A guard, not a fix: it fails clearly if the pin above is ever lowered or removed.
      - name: Check npm is new enough for trusted publishing
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $v is older than 11.5.1, which trusted publishing needs." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Safe to re-run: npm refuses a version twice, so look first.
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          case "$v" in *-*) tag=beta ;; *) tag=latest ;; esac
          if head=$(npm view "$name@$v" gitHead 2>/dev/null); then
            if [ "$head" = "$GITHUB_SHA" ]; then
              echo "already published from this commit; skipping npm publish"
              exit 0
            fi
            echo "version $v is already on npm from commit ${head:-unknown}; bump the version" >&2
            exit 1
          fi
          npm publish --access public --provenance --tag "$tag"
  # The same version on GitHub Packages, so it shows under Packages on the repo page. Runs only after npm succeeded.
  github-packages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@khubaibqaiser'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm publish runs prepack, which builds dist/.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          case "$v" in *-*) tag=beta ;; *) tag=latest ;; esac
          if npm view --registry https://npm.pkg.github.com "$name@$v" version 2>/dev/null | grep -qx "$v"; then
            echo "already on GitHub Packages; skipping publish"
            exit 0
          fi
          npm publish --registry https://npm.pkg.github.com --tag "$tag"
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; skipping"
            exit 0
          fi
          v=$(node -p "require('./package.json').version")
          pre=""
          case "$v" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/release-notes/$v.md" $pre
