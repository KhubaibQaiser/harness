id: gitleaks-ci
kind: ci
title: Gitleaks CI
source:
  type: own
  files:
    - from: ci/gitleaks.yml
      to: .github/workflows/harness-gitleaks.yml
license: Apache-2.0
min_claude_code: 2.1.295
applies_when:
  always: true
cost:
  context: none
  setup: low
stance: optional
side_effects: [downloads-binary]
why: >-
  Adds a GitHub workflow that scans the full git history for secrets with gitleaks 8.30.1 on pull requests and pushes to main, printing findings redacted. Nobody can skip it with --no-verify. The binary download is checksum-verified.
evidence:
  - docs/research/2026-11-13-m4-backend-infra.md#4-gitleaks
  - "gitleaks v8.30.1: tag commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e (git ls-remote, 2026-11-13); linux_x64 tarball sha256 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb, the same as .github/workflows/ci.yml"
