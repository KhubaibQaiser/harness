  - "plugin.json mcpServers: {\"sentry\": {\"type\": \"http\", \"url\": \"https://mcp.sentry.dev/mcp?utm_source=plugin\"}}, a hosted server, deferred tools. Eight skills (sentry-get-started, sentry-instrument, sentry-debug-issue, sentry-fix-stack-traces, sentry-create-alert, sentry-setup-releases, sentry-otel-exporter-setup, sentry-snapshots-cocoa). No hooks, agents or commands in the tree listing. README: \"A few router skills are always available; the rest ... load on demand, so they do not crowd the model's context\": context low"
  - "Requirements: a Sentry account for the hosted MCP server (the README says it queries \"your Sentry environment\"; I did not read the sign-in flow). Error reports and stack traces you ask about come from Sentry's service"
  - "Pin choice: the official marketplace pins this sha (anthropics/claude-plugins-official at a2e251d9b97b, url getsentry/plugin-claude). Vendor HEAD 1b082a07d1a8 is 6 commits ahead (skill and reference changes; the HEAD tree has no path containing hook, .mcp, agents/ or commands/)"
  - "applies_when note: the audit gives Project scope; the docs name no dependency, so the @sentry SDK packages (npm view: 11.10.0 for node, react, nextjs and browser; react-native 8.33.0) are my inference for 'projects that use Sentry'. It will not match a project that has not installed the SDK yet"
  - "Overlap: getsentry-skills (plugin sentry-skills) is a different plugin from the same vendor; the repo getsentry/plugin-claude says it is generated from getsentry/sentry-for-ai"
