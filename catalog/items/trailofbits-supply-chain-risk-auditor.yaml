  - "https://github.com/trailofbits/skills/blob/711af095215ad4ecde5b90cd1d0124b3f1c4ca9e/plugins/supply-chain-risk-auditor/README.md Usage: \"Requirements: `uv` (the scripts are stdlib-only Python). Authenticated `gh` is strongly recommended\" (setup medium). A deterministic collector \"queries registries and advisory databases\" (README: OSV, npm and PyPI registries, GitHub, OpenSSF Scorecard), so your dependency names go to those public services; HTTP responses are cached under the system temp directory. It \"never installs, builds, or executes the project or its packages\""
