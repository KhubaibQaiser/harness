name: release
on:
  push:
    tags: ['v*']
  # Publishing is manual: Actions > release > Run workflow, with the tag picked under "Use workflow from".
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag equals package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v" >&2
            exit 1
          fi
  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    # A tag push only checks; this manual run on a tag is the approval to publish.
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No --provenance: npm requires a public source repo, and this repo is private.
      - name: Publish
        run: |
          v=$(node -p "require('./package.json').version")
          case "$v" in *-*) tag=beta ;; *) tag=latest ;; esac
          npm publish --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
