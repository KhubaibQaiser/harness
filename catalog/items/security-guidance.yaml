id: security-guidance
kind: plugin
title: "Security guidance"
source: {"type": "git-subdir", "repo": "anthropics/claude-plugins-official", "path": "plugins/security-guidance", "plugin": "security-guidance", "sha": "a2e251d9b97b909bf728b3e84fc8d17e6aba0063"}
license: Apache-2.0
min_claude_code: 2.1.314
applies_when: {"always": true}
cost: {"context": "medium", "setup": "low"}
