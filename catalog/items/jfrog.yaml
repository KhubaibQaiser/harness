id: jfrog
kind: plugin
title: "JFrog (Artifactory, Xray, Curation)"
source: {"type": "github", "repo": "jfrog/claude-plugin", "plugin": "jfrog", "sha": "9b1f8f6c883522a87502e5155abd593a8befe3c5"}
license: Apache-2.0
min_claude_code: 2.1.314
plugin_version: "0.3.11"
applies_when: {"project_types": ["other"]}
cost: {"context": "medium", "setup": "high"}
stance: optional
side_effects: ["installs-hook"]
why: "Connect Claude Code to JFrog to manage, secure, and govern your software supply chain."
evidence:
  - "Owner Q5 line: neutral, recommended only to teams already on Artifactory or Nexus (here: Artifactory). No Facts field shows that. The recommender must check that the team uses Artifactory (a JFrog platform URL) before it recommends this item."
  - "project_types [other] is a placeholder; recommend only when the team says it uses Artifactory/Nexus"
  - "https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/.claude-plugin/plugin.json (version 0.3.11, license Apache-2.0; the why sentence is the second sentence of its description)"
  - "https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/LICENSE (Apache-2.0 per GitHub)"
  - "https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/.mcp.json (hosted http MCP server at ${JFROG_URL}/mcp: the URL is the customer's own JFrog host; README: OAuth)"
  - "https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/hooks/hooks.json: SessionStart runs modules/claude-session-start.mjs package-resolution, scripts/claude-register-align-watch-paths.mjs, scripts/claude-align-mcp-json.mjs and an async `npx --yes --registry ${JFROG_AGENT_GUARD_REPO:-https://releases.jfrog.io/artifactory/api/npm/coding-agents-npm/} @jfrog/agent-guard --version`; a FileChanged hook (matcher installed_plugins|known_marketplaces.json) re-runs claude-align-mcp-json.mjs; PreToolUse on Skill|Read and UserPromptExpansion run `npx --yes --prefer-offline --registry <same> @jfrog/agent-guard --enforce-skill --client claude-code`. UNPINNED RUN-TIME FETCH: those three npx commands name @jfrog/agent-guard with no version, so the wrapper fetches and runs whatever the JFrog registry serves, at session start and on every Skill or Read call and prompt expansion; nothing is pinned. By contrast the MCP-rewrite path is pinned: https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/modules/core/rewrite-mcp-json.mjs line 56 `DEFAULT_AGENT_GUARD_VERSION = \"1.6.0\"` (comment: \"Pinned so a session start cannot execute whatever the registry currently tags as latest\"; override JFROG_AGENT_GUARD_VERSION). Owner ruling: keep, flagged, as with playwright. The align scripts rewrite other installed plugins' .mcp.json so stdio MCP entries launch via @jfrog/agent-guard (README \"Plugin MCP rewrite\"): it changes other plugins' config"
  - "https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/modules/core/agents-config.mjs (the session-start hook calls ensureAgentsConfigScaffold(), which creates ~/.jfrog/agents-conf.json and a lock file in the home directory: a write outside the project). https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/modules/package-resolution/templates/package-resolution.md is 4,428 bytes, the text claude-session-start.mjs emits as hookSpecificOutput.additionalContext when package resolution is on: hooks inject text, so cost.context medium; installs-hook"
  - "https://github.com/jfrog/claude-plugin/blob/9b1f8f6c883522a87502e5155abd593a8befe3c5/README.md Prerequisites: \"JFrog host URL and access token\", Node.js 18+ with npx, `jf` CLI, jq and curl, a configured JFrog instance (setup high). Skill Governance is described as an opt-in-by-entitlement preview: \"the Agent Guard returns \\\"allow\\\" for an unconfigured or unentitled user\""
  - "audit.html says: \"Skip aikido, sonarqube, jfrog and sonatype; they duplicate semgrep.\" The owner's Q5 answer (progress.md) replaced this: jfrog is neutral, for Artifactory teams only"
  - "Source choice: the pin is the official marketplace entry (anthropics/claude-plugins-official at a2e251d9b97b, source url jfrog/claude-plugin); upstream HEAD is 0c9acc7daf65, newer"
