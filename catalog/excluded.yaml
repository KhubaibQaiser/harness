- id: prisma
  reason: "no license: prisma/claude-plugin has no LICENSE file, no license field in plugin.json and no README at the marketplace pin 815dbc4a045a (the repo holds only .claude-plugin and .mcp.json; GitHub license is null). Its .mcp.json also runs `npx -y prisma mcp` unpinned"
- id: mergify
  reason: "no open-source license: Mergifyio/mergify-cli LICENSE (marketplace pin 6307ed10e862) is a proprietary Mergify licence that allows running the software unmodified only with the Mergify service; plugin.json says LicenseRef-Mergify-Proprietary and the GitHub license is NOASSERTION. Brief step 4 excludes non-standard licenses; owner may add it back as vendor-terms"
- id: supabase-agent-skills
  reason: "left out by the owner: overlaps the supabase plugin (same plugin name)"
- id: claude-security
  reason: "proprietary license: plugins/claude-security/LICENSE (marketplace pin a2e251d9b97b) says the plugin is \"proprietary to Anthropic\", all rights reserved, with a limited, non-transferable licence to run and modify it for internal use solely with Anthropic products; it is not an open-source or SPDX licence. plugin.json says \"SEE LICENSE IN LICENSE\". Owner may add it back as vendor-terms"
- id: semgrep
  reason: "no license: semgrep/mcp-marketplace (marketplace pin b58f407c6ac0, plugin dir plugin/) has no LICENSE or NOTICE file at the pin or at HEAD, no license field in plugin.json, and no license line in README.md; GitHub license is null. It also ships precompiled hook binaries and downloads and auto-updates a Guardian binary from semgrep.dev, so it is not just a pointer to a hosted server. Owner may add it back as vendor-terms"
- id: sonarqube
  reason: "no open-source license: SonarSource/sonarqube-agent-plugins LICENSE (marketplace pin 5a9356d957db) is the SONAR Source-Available License v1.0 (plugin.json license SSAL-1.0), which restricts use that competes with SonarQube and is not an SPDX open-source licence; GitHub says NOASSERTION. Brief step 4 excludes a non-standard license (as for mergify). If added back, the owner's Q5 stance applies: discouraged with stance_reason \"belongs in CI quality gates, not the agent session.\""
- id: evals-skills
  reason: "archived upstream: hamelsmu/evals-skills (MIT, 1675 stars) is archived on GitHub (last commit 22418da2bfb1, 2026-08-16); audit.html's pick for fitness-app's AI feature (\"Error analysis and checking LLM judges against human labels\"). langfuse (judge-calibration and error-analysis references) and deepeval cover the area"
- id: getsentry-skills
