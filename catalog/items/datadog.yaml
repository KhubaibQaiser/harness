id: datadog
kind: plugin
title: "Datadog"
source: {"type": "github", "repo": "datadog-labs/claude-code-plugin", "plugin": "datadog", "sha": "a1603119c813f528b2d925a0ccadd73bf930550b"}
license: Apache-2.0
min_claude_code: 2.1.314
plugin_version: "0.7.19"
applies_when: {"any_dep": ["dd-trace", "@datadog/browser-rum"]}
cost: {"context": "medium", "setup": "medium"}
stance: optional
side_effects: ["installs-hook", "telemetry-on-by-default"]
why: "Use Datadog directly in Claude Code through a preconfigured Datadog MCP server."
evidence:
  - "https://github.com/datadog-labs/claude-code-plugin/blob/a1603119c813f528b2d925a0ccadd73bf930550b/.claude-plugin/plugin.json (version 0.7.19; the why sentence is the first sentence of its description, which adds \"This plugin is in preview.\")"
  - "https://github.com/datadog-labs/claude-code-plugin/blob/a1603119c813f528b2d925a0ccadd73bf930550b/LICENSE (Apache-2.0, GitHub spdx Apache-2.0)"
  - "Pin choice (owner exception, fix round 1): vendor HEAD a1603119c813, not the marketplace pin 195f570c002b (v0.7.17). The marketplace pin's hooks/hooks.json has a SessionEnd hook (viz/hooks/session_end.sh) that HEAD removed; HEAD wires only the PostToolUse hook. Everything below was re-read at HEAD. Version drift is not applicable (github type); the HEAD marketplace entry still points at the older sha"
  - "audit.html: \"Datadog is in the engineering plugin but not authenticated.\" (Observability row; optional). The engineering item (batch 3) bundles a hosted Datadog connector, so the two overlap: owner note"
  - ".dd_claude-code_mcp.json at HEAD: hosted http server https://${DD_MCP_DOMAIN:-not-setup}/v1/mcp (domain chosen in /ddsetup), headers DD_API_KEY, DD_APPLICATION_KEY, X-Datadog-MCP-Referrer-Name/Version and X-Datadog-MCP-Toolsets (default core,visualizations). README: \"A Datadog account\"; \"By default, authentication is handled via OAuth in your browser\", key authentication also supported (setup medium); your logs, metrics and traces queries go to Datadog. README: \"This plugin is currently in Preview\""
  - "hooks/hooks.json at HEAD: one PostToolUse hook on the get_widget and visualize_tabular_data MCP tools, running viz/hooks/forward.sh: installs-hook. forward.sh emits hookSpecificOutput with additionalContext (a bail reason such as \"Could not render the visualization properly due to missing dependency\") and updatedToolOutput that replaces the tool result with its content_text, so the hook writes into the model's context: cost.context medium (only when those two tools run). It does not approve commands. viz/hooks/session_end.sh is still in the tree but no longer wired"
  - "viz/hooks/forward.sh ensure_daemon_macos: on macOS it starts a local daemon with `swift ${CLAUDE_PLUGIN_ROOT}/viz/ddviz.swift` (a source file in the plugin) that draws a floating chart panel; needs the Swift toolchain (xcode-select), otherwise it falls back to a sandbox URL link. viz/hooks/ddviz_entrypoint.sh limits the panel to CLAUDE_CODE_ENTRYPOINT cli or claude-vscode. /ddviz disables it"
  - "Telemetry: viz/hooks/ddviz_telemetry.sh (called by forward.sh as emit_event) posts aggregate logs (no user, session or install id per its header) to browser-intake-datadoghq.com with a client token embedded in the file. It returns early when DO_NOT_TRACK or DISABLE_TELEMETRY is 1 or true. telemetry-on-by-default is recorded. Owner ruling (fix round 1): the opt-out stays a note, because a plugin item carries no env; DO_NOT_TRACK=1 or DISABLE_TELEMETRY=1 in project settings env would switch it off"
  - "applies_when note: the docs name no dependency; dd-trace (npm view: 6.23.0) and @datadog/browser-rum (7.16.2) are my inference for 'projects that use Datadog'"
