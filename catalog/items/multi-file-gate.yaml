id: multi-file-gate
kind: own-hook
title: Multi-file gate
source:
  type: own
  checks: [multiFile]
license: Apache-2.0
min_claude_code: 2.1.295
applies_when:
  always: true
cost:
  context: none
  setup: none
stance: optional
why: >-
  Before an agent edits a second source file in one turn, you are asked once; approval covers the rest of the turn. Includes the unattended reason requirement.
