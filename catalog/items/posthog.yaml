why: "Access PostHog analytics, feature flags, experiments, error tracking, and insights directly from your AI coding tool."
evidence:
  - "https://github.com/PostHog/ai-plugin/blob/e0fbf5e742fb4242c4ea509b395b2e343642f0b7/.claude-plugin/plugin.json (version 1.1.67, license MIT; the why sentence is the first sentence of its description)"
  - "License: the repo has no LICENSE file and GitHub reports none; the MIT line in plugin.json and in .claude-plugin/marketplace.json counts under the owner's rule. The plugin also points at PostHog's hosted MCP server, whose terms I did not read: owner decision in the note"
  - "audit.html: \"Lets the agent read the real error or funnel before it touches the fix. Both are on your résumé and neither is in your loop yet.\" (sentry · posthog, Project scope) and \"Prefer entries the vendor itself publishes\""
  - "https://github.com/PostHog/ai-plugin/blob/e0fbf5e742fb4242c4ea509b395b2e343642f0b7/.mcp.json: hosted http server https://mcp.posthog.com/mcp with header x-posthog-mcp-consumer: plugin; README step 2: sign in by OAuth through /mcp (setup medium: a PostHog account). Tools are deferred; the plugin also ships an error-analyzer agent and llma-cc commands"
  - "hooks/hooks.json at the pin: SessionEnd runs telemetry/hooks/session-end-llma.py and PreToolUse (matcher __exec$) runs hooks/gate-exec-write.sh: installs-hook. Neither prints text to the model: the session-end script exits without sending unless POSTHOG_LLMA_CC_ENABLED=true and POSTHOG_API_KEY are both set (config.py: default \"false\"; README: both are required), so session capture to PostHog LLM Analytics is opt-in, not on by default. The gate returns permissionDecision ask (a prompt for the user on sensitive write calls to mcp__posthog__exec) and fails open; it does not auto-approve. Hook context: none. cost.context is nevertheless high because of the skill count (next line)"
  - "cost.context high (fix round 1, plan ruling 18: each skill's name and description is always loaded): the contents listing at the pin shows 161 skill directories under skills/ (162 entries), so 161 skill descriptions load in every session"
  - "Pin choice: the official marketplace pins this sha (anthropics/claude-plugins-official at a2e251d9b97b, url PostHog/ai-plugin); the pin stays (fix round 1). Vendor HEAD 3f06d3adcc58 is 36 commits ahead and adds a PostToolUse (Skill) hook, hooks/skill-invoked.sh, that the pin lacks. Its header: \"anonymous plugin usage analytics\", sends a \"plugin skill invoked\" event (skill name and safe metadata) to a PostHog-owned project, \"on by default\", opt out with DO_NOT_TRACK=1, POSTHOG_PLUGIN_TELEMETRY_DISABLED=1, DISABLE_TELEMETRY=1 or CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1. The pin has only SessionEnd and PreToolUse hooks, so the marketplace pin avoids this default-on telemetry hook"
  - "applies_when note: the audit gives Project scope; the docs name no dependency, so the PostHog SDK packages (npm view: posthog-js 1.445.1, posthog-node 5.61.2, posthog-react-native 4.85.2) are my inference"
