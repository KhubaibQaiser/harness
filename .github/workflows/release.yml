name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# One release run at a time; a second one waits instead of cancelling a publish in progress.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag equals package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v" >&2
            exit 1
          fi
  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    # npm trusted publishing (OIDC): no token; npm links this workflow to the package.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # fetches origin/main too, for the check below
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge it to main, then tag a commit on main." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish
        run: |
          v=$(node -p "require('./package.json').version")
          case "$v" in *-*) tag=beta ;; *) tag=latest ;; esac
          npm publish --access public --provenance --tag "$tag"
